<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --cizgi: #CBD2D8;

    --yesil: #0A5F73;

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--zemin);

    font-size: 16px;

  }
  button, input, select { font: inherit; color: inherit; }

  .kap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .baslik-cubuk { background: var(--koyu); color: var(--beyaz); padding: 16px 20px 14px; position: sticky; top: 0; z-index: 5; }
  .baslik-satir { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .logo { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 21px; letter-spacing: .2px; }
  .adim-yazi { font-size: 14px; }
  .bas-btn { background: transparent; border: 0; color: #D5DBE0; text-decoration: underline; font-size: 14px; min-height: 36px; padding: 0 4px; }
  .ilerleme { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
  .ilerleme div { height: 5px; background: #48525C; }

  main { flex-grow: 1; display: flex; flex-direction: column; padding: 22px 20px 24px; }
  h1 { margin: 0; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; }
  h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .alt { margin: 6px 0 0; font-size: 15px; color: var(--gri); }
  .kart { background: var(--beyaz); border: 1px solid var(--cizgi); border-radius: 8px; padding: 14px; }
  .yigin { display: flex; flex-direction: column; gap: 8px; }
  .bosluk { margin-top: 16px; }
  .alt-bolum { margin-top: auto; padding-top: 18px; }
  .ana-btn { width: 100%; min-height: 54px; border: 0; border-radius: 6px; background: var(--koyu); color: var(--beyaz); font-size: 17px; font-weight: 700; }
  .ana-btn:disabled { background: #8E99A3; cursor: not-allowed; }
  .sari-btn { background: var(--sari); color: var(--koyu); }
  .cerceve-btn { min-height: 54px; background: transparent; border: 2px solid var(--koyu); border-radius: 6px; font-size: 16px; font-weight: 700; }
  .cerceve-btn:disabled { opacity: .3; cursor: not-allowed; }
  .link-btn { background: transparent; border: 0; text-decoration: underline; font-weight: 600; min-height: 44px; padding: 0 4px; }
  .iki-btn { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }
  .secenek { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 14px; text-align: left; background: var(--beyaz); border: 1px solid var(--cizgi); border-radius: 8px; }

  .hap-sira { display: flex; flex-wrap: wrap; gap: 8px; }

  .hap.secili { background: var(--koyu); color: var(--beyaz); border-color: var(--koyu); }
  label { display: block; font-size: 14px; font-weight: 600; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], select {
    display: block; width: 100%; height: 48px; margin-top: 5px; padding: 0 12px;
    background: var(--beyaz); border: 1px solid #8E99A3; border-radius: 6px; font-size: 17px;
  }

  .uyari svg { flex-shrink: 0; margin-top: 1px; }
  .hata { color: var(--kirmizi); font-weight: 600; font-size: 15px; margin-top: 10px; }
  .sekmeler { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; }

  .sekme.aktif { border: 2px solid var(--koyu); }
  .sekme.gecti { background: var(--yesil-zemin); color: var(--yesil); }
  .sekme.kaldi { background: var(--kirmizi-zemin); color: var(--kirmizi); }

  .uclu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }

  .kriter { display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 14px; text-align: left; background: #F7F8F9; border: 1px solid var(--cizgi); border-radius: 6px; color: var(--gri-koyu); }
  .kriter.secili { background: var(--beyaz); border: 2px solid var(--koyu); color: var(--koyu); font-weight: 700; }
  .kriter:disabled { opacity: .55; cursor: not-allowed; }
  .karsi { display: grid; grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr); align-items: center; gap: 6px; margin-top: 20px; }
  .karsi .kutu { min-height: 88px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; background: var(--koyu); color: var(--beyaz); border-radius: 8px; font-family: "Barlow Condensed", sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05; }
  .karsi span { text-align: center; font-weight: 700; color: var(--gri); }
  .cubuk-satir { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }

  .cubuk.sari div { background: var(--sari); }

  .sonuc-ikili { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .sonuc-kart { background: var(--beyaz); border: 1px solid var(--cizgi); border-radius: 6px; padding: 12px; }
  .sonuc-kart.koyu { background: var(--koyu); color: var(--beyaz); border-color: var(--koyu); border-top: 6px solid var(--sari); }
  .sonuc-kart.kirmizi-ust { border-top: 6px solid var(--kirmizi); }
  .sonuc-kart h2 { font-size: 14px; font-weight: 600; color: var(--gri); }
  .sonuc-kart.koyu h2 { color: #D5DBE0; }
  .sonuc-kart .ad { margin-top: 6px; font-family: "Barlow Condensed", sans-serif; font-size: 28px; font-weight: 700; line-height: 1.05; }
  .sonuc-kart .puan { font-size: 24px; font-weight: 700; }
  .satir { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--cizgi-acik); }
  .satir:last-child { border-bottom: 0; }
  ul.duz { margin: 8px 0 0; padding-left: 20px; }
  ul.duz li { margin-top: 4px; }
  .adim-liste { display: flex; flex-direction: column; margin-top: 40px; }
  .adim-liste .o { display: flex; gap: 16px; min-height: 86px; }
  .adim-liste .daire { width: 34px; height: 34px; border-radius: 50%; background: var(--sari); color: var(--koyu); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .adim-liste .cizgi { flex-grow: 1; margin: 6px 0; border-left: 3px dashed var(--sari); }
  .adim-liste .sol { display: flex; flex-direction: column; align-items: center; width: 34px; }

  .karsilama .alt { color: #D5DBE0; font-size: 18px; }
  .karsilama .kucuk { color: #BCC5CC; text-align: center; margin-top: 12px; }
  .yazdir-gizle { }
  @media print {
    .baslik-cubuk, .yazdir-gizle { display: none !important; }
    body { background: #fff; }
    .kart, .sonuc-kart { break-inside: avoid; }
  }
</style>

<body>
<div class="kap" id="uygulama"></div>

<script src="katalog.js"></script>
<script>
/* =========================================================
   1) ARAÇ KATALOĞU
   katalog.js dosyasından gelir (kaynak: TSB Kasko Değer Listesi).
   Versiyon kaydı: [ad, HP (0 = bilinmiyor), yakıt, vites, kasa, paket seviyesi, ilk yıl, [kasko değerleri, bin TL]]
   ========================================================= */
const KASA_AD = { H: "Hatchback", S: "Sedan", W: "Station Wagon", U: "SUV", C: "Crossover", M: "MPV", P: "Coupe", B: "Cabrio", T: "Hafif Ticari", K: "Pick-up" };
const YAKIT_AD = { B: "Benzin", D: "Dizel", H: "Hibrit", E: "Elektrik", L: "LPG" };
const VITES_AD = { O: "Otomatik", M: "Manuel", "": "" };
const KATALOG_VAR = typeof KATALOG !== "undefined";
function markalar() { return KATALOG_VAR ? Object.keys(KATALOG).sort((a, b) => a.localeCompare(b, "tr")) : []; }
function modeller(marka) { return marka && KATALOG[marka] ? Object.keys(KATALOG[marka]).sort((a, b) => a.localeCompare(b, "tr", { numeric: true })) : []; }
function versiyonDegeri(v, yil) { const i = yil - v[6]; return (i >= 0 && i < v[7].length) ? v[7][i] : 0; }
function modelYillari(marka, model) {
  const set = new Set();
  KATALOG[marka][model].v.forEach(v => v[7].forEach((d, i) => { if (d) set.add(v[6] + i); }));
  return [...set].sort((a, b) => b - a);
}
function yilVersiyonlari(marka, model, yil) {
  return KATALOG[marka][model].v.map((v, i) => ({ v, i })).filter(x => versiyonDegeri(x.v, yil) > 0);
}

/* Kasa tipine göre otomatik konfor puanı (1-5). Kullanıcı değiştirebilir. */
const KONFOR = { "Hatchback": 2, "Sedan": 3, "Station Wagon": 3, "Coupe": 2, "Cabrio": 2, "Crossover": 4, "SUV": 5, "MPV": 4, "Hafif Ticari": 2, "Pick-up": 3 };

/* Yakıt fiyatları (TL/litre, elektrik TL/kWh). Varsayılan: 2 Kasım 2026, İstanbul Avrupa yakası. */
const YAKIT_VARSAYILAN = { benzin: 80.40, dizel: 100.50, lpg: 41.20, elektrik: "" };

/* =========================================================
   2) KRİTERLER
   yon: "min" = düşük olan iyi, "max" = yüksek olan iyi
   ========================================================= */
const KRITERLER = [
  { id: "fiyat",   ad: "Fiyat",                yon: "min" },
  { id: "yakit",   ad: "Yakıt maliyeti",       yon: "min" },
  { id: "km",      ad: "Kilometre",            yon: "min" },
  { id: "konfor",  ad: "Konfor",               yon: "max" },
  { id: "hp",      ad: "Motor gücü (HP)",      yon: "max" },
  { id: "yas",     ad: "Yaş",                  yon: "min" },
  { id: "paket",   ad: "Aracın paketi",        yon: "max" },
  { id: "hasar",   ad: "Hasar kaydı (TL)",     yon: "min" },
  { id: "degisen", ad: "Değişen parça sayısı", yon: "min" },
  { id: "boyali",  ad: "Boyalı parça sayısı",  yon: "min" },
  { id: "satis",   ad: "Satış piyasası",       yon: "max" }
];
const KRITER = Object.fromEntries(KRITERLER.map(k => [k.id, k]));
const MAKS_KRITER = 6;
const BU_YIL = new Date().getFullYear();


/* =========================================================
   3) DURUM (tarayıcıda saklanır, sayfa yenilenince kaybolmaz)
   ========================================================= */
const ANAHTAR = "arabaKarar.v1";
function bosDurum() {
  return {
    adim: 0,
    araclar: [],
    secim: { marka: "", model: "", yil: "", versiyon: "", elle: false,
             elleAd: "", elleYil: "", elleYakit: "Benzin", elleHp: "", elleTuketim: "", elleKasa: "Hatchback", elleSeviye: 3 },
    aktifArac: 0,
    kriterler: [],
    siralama: [],
    yakit: { ...YAKIT_VARSAYILAN },
    hata: ""
  };
}
let D;
try { D = JSON.parse(localStorage.getItem(ANAHTAR)) || bosDurum(); } catch (e) { D = bosDurum(); }
if (!Array.isArray(D.siralama)) D.siralama = [];
if (D.secim.versiyon === undefined) D.secim = { ...bosDurum().secim };
D.yakit = { ...YAKIT_VARSAYILAN, ...D.yakit };
function kaydet() { try { localStorage.setItem(ANAHTAR, JSON.stringify(D)); } catch (e) {} }
/* Sıralamayı seçili kriterlerle eşle: kalanların sırası korunur, yeniler sona eklenir */
function siralamaEsle() {
  D.siralama = D.siralama.filter(k => D.kriterler.includes(k));
  D.kriterler.forEach(k => { if (!D.siralama.includes(k)) D.siralama.push(k); });
}

/* =========================================================
   4) HESAPLAMA FONKSİYONLARI
   ========================================================= */
/* Hem sayıları hem de "1.250.000" ve "5,5" gibi Türkçe yazımları okur */
function sayi(v) {
  if (typeof v === "number") return v;
  if (v === null || v === undefined) return NaN;
  let s = String(v).trim().replace(/\s/g, "");
  if (s === "") return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return isNaN(n) ? NaN : n;
}
function yakitFiyati(tur) {
  if (tur === "Dizel") return sayi(D.yakit.dizel);
  if (tur === "LPG") return sayi(D.yakit.lpg);
  if (tur === "Elektrik") return sayi(D.yakit.elektrik);
  return sayi(D.yakit.benzin); // Benzin ve Hibrit
}
function aracYasi(a) { return Math.max(0, BU_YIL - Number(a.yil)); }
function deger(a, id) {
  switch (id) {
    case "fiyat": return sayi(a.fiyat);
    case "yakit": return sayi(a.tuketim) * yakitFiyati(a.yakit);
    case "km": return sayi(a.km);
    case "konfor": return sayi(a.konfor);
    case "hp": return sayi(a.hp);
    case "yas": return aracYasi(a);
    case "paket": return sayi(a.seviye);
    case "hasar": return sayi(a.hasar);
    case "degisen": return sayi(a.degisen);
    case "boyali": return sayi(a.boyali);
    case "satis": return sayi(a.satis);
  }
  return NaN;
}
function yillikKm(a) {
  const km = sayi(a.km);
  if (isNaN(km)) return null;
  return Math.round(km / Math.max(1, aracYasi(a)));
}
/* Güvenlik durumu: Evet varsa "kaldi", Bilmiyorum varsa "dogrulanmadi", ikisi de Hayır ise "gecti" */
function guvenlik(a) {
  const c = [a.agir, a.tasiyici];
  if (c.includes("evet")) return "kaldi";
  if (c.includes("bilmiyorum") || c.includes(null) || c.includes(undefined)) return "dogrulanmadi";
  return "gecti";
}
const DURUM_AD = { gecti: "Geçti", kaldi: "Kaldı", dogrulanmadi: "Doğrulanmadı" };

/* Sıra toplamı yöntemi: n kriterde 1. sıra n puan, son sıra 1 puan alır.
   Ağırlık = puan / puanların toplamı. Dönen dizi D.kriterler sırasındadır. */
function agirliklar() {
  siralamaEsle();
  const n = D.siralama.length;
  const toplam = n * (n + 1) / 2;
  return D.kriterler.map(k => (n - D.siralama.indexOf(k)) / toplam);
}
/* TOPSIS: vektör normalizasyonu, ideal ve negatif ideal çözüme uzaklık */
function topsis(araclar, kriterler, w) {
  const m = araclar.length, n = kriterler.length;
  const X = araclar.map(a => kriterler.map(k => deger(a, k)));
  const R = Array.from({ length: m }, () => Array(n).fill(0));
  for (let j = 0; j < n; j++) {
    const payda = Math.sqrt(X.reduce((s, r) => s + r[j] * r[j], 0));
    for (let i = 0; i < m; i++) R[i][j] = payda === 0 ? 0 : (X[i][j] / payda) * w[j];
  }
  const ideal = [], negatif = [];
  for (let j = 0; j < n; j++) {
    const kol = R.map(r => r[j]);
    const enB = Math.max(...kol), enK = Math.min(...kol);
    if (KRITER[kriterler[j]].yon === "max") { ideal.push(enB); negatif.push(enK); }
    else { ideal.push(enK); negatif.push(enB); }
  }
  return araclar.map((a, i) => {
    let dArti = 0, dEksi = 0;
    for (let j = 0; j < n; j++) {
      dArti += (R[i][j] - ideal[j]) ** 2;
      dEksi += (R[i][j] - negatif[j]) ** 2;
    }
    dArti = Math.sqrt(dArti); dEksi = Math.sqrt(dEksi);
    const puan = (dArti + dEksi) === 0 ? 0.5 : dEksi / (dArti + dEksi);
    return { arac: a, puan };
  }).sort((x, y) => y.puan - x.puan);
}

/* =========================================================
   5) YARDIMCILAR
   ========================================================= */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function aracAdi(a) { return a.marka ? a.marka + " " + a.model : a.model; }
function kisaAd(a) { return a.model; }
function tl(x) { return isNaN(x) ? "-" : Math.round(x).toLocaleString("tr-TR"); }
function puanYaz(x) { return x.toFixed(2).replace(".", ","); }
const UYARI_IKON = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v5"/><path d="M12 17.5v.5"/></svg>';
const TIK_IKON = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>';
let siradakiId = Date.now();

/* =========================================================
   6) EKRANLAR
   ========================================================= */
const ADIM_SAYISI = 7;
function ust(adim) {
  let cubuk = "";
  for (let i = 1; i <= ADIM_SAYISI; i++) cubuk += `<div class="${i <= adim ? "dolu" : ""}"></div>`;
  return `<header class="baslik-cubuk">
    <div class="baslik-satir">
      <span class="logo">Araba Karar</span>
      <span class="adim-yazi">Adım ${adim} / ${ADIM_SAYISI}</span>
      <button type="button" class="bas-btn" data-is="sifirla">Baştan başla</button>
    </div>
    <div class="ilerleme" aria-hidden="true">${cubuk}</div>
  </header>`;
}

function ekranKarsilama() {
  const adimlar = [
    ["Araçları seç", "Marka, model, yıl, motor ve paket"],
    ["Güvenlik kontrolünü yap", "Ağır hasar, taşıyıcı aksam ve airbag"],
    ["Önceliklerini belirle", "En fazla 6 kriter seç ve önem sırasına koy"],
    ["Sonucu gör", "Sıralama, gerekçe ve dikkat edilecekler"]
  ];
  const liste = adimlar.map((a, i) => `<div class="o">
      <div class="sol"><div class="daire">${i + 1}</div>${i < adimlar.length - 1 ? '<div class="cizgi"></div>' : ""}</div>
      <div><div style="font-size:18px;font-weight:600">${a[0]}</div><div style="color:#BCC5CC;font-size:15px">${a[1]}</div></div>
    </div>`).join("");
  return `<main class="karsilama">
    <div class="logo">Araba Karar</div>

function ucluSecim(a, alan) {

function ekranGuvenlik() {
  if (D.aktifArac >= D.araclar.length) D.aktifArac = 0;
  const a = D.araclar[D.aktifArac];
  const sekmeler = D.araclar.map((x, i) => {
    const cevapli = x.agir && x.tasiyici;
    const d = cevapli ? guvenlik(x) : "";
    return `<button type="button" class="sekme ${d} ${i === D.aktifArac ? "aktif" : ""}" data-is="aktif" data-i="${i}" ${i === D.aktifArac ? 'aria-current="true"' : ""}>${esc(kisaAd(x))}<br>${cevapli ? DURUM_AD[d] : "Sırada"}</button>`;
  }).join("");
  let durum = "";
  if (a.agir && a.tasiyici) {
    const d = guvenlik(a);
    if (d === "kaldi") durum = `<div class="uyari kirmizi bosluk">${UYARI_IKON}<div><strong>Güvenlik kontrolünden geçmedi.</strong> Sonuçta kırmızı uyarıyla gösterilecek.</div></div>`;
    else if (d === "dogrulanmadi") durum = `<div class="uyari bosluk">${UYARI_IKON}<div><strong>Doğrulanmadı.</strong> Bu araç güvenli sayılmayacak.</div></div>`;
    else durum = `<div class="uyari yesil bosluk">${TIK_IKON}<div><strong>Güvenlik kontrolünden geçti.</strong></div></div>`;
  }
  const hepsi = D.araclar.every(x => x.agir && x.tasiyici);
  const sonraki = D.araclar.findIndex((x, i) => i !== D.aktifArac && !(x.agir && x.tasiyici));
  return ust(3) + `<main>
    <h1>Güvenlik kontrolü</h1>

    <div class="sekmeler bosluk">${sekmeler}</div>
    <section class="kart bosluk">
      <h2 style="font-size:20px">${esc(aracAdi(a))}</h2>
      <div class="soru">Ağır hasar kaydı var mı?</div>
      ${ucluSecim(a, "agir")}
      <div class="soru">Taşıyıcı aksamlarda veya airbaglerde işlem ya da değişim var mı?</div>
      ${ucluSecim(a, "tasiyici")}
      ${durum}

    <p class="kucuk bosluk">"Bilmiyorum" seçilen araç güvenli sayılmaz, sonuçta "doğrulanmadı" olarak görünür.</p>

/* Yıllık ortalama km notu (eşikler örnek: 5.000 altı düşük, 35.000 üstü yüksek) */
function ykNotu(a) {
  const yk = yillikKm(a);
  if (yk === null) return "";
  if (yk < 5000) return `<div class="uyari" style="margin-top:8px">${UYARI_IKON}<div><strong>Yıllık ortalama: ${tl(yk)} km.</strong> Beklenenden düşük olabilir, kilometreyi servis ve ekspertiz kayıtlarıyla doğrula.</div></div>`;
  if (yk > 35000) return `<div class="uyari" style="margin-top:8px">${UYARI_IKON}<div><strong>Yıllık ortalama: ${tl(yk)} km.</strong> Yoğun kullanılmış olabilir, kullanım geçmişini sor.</div></div>`;
  return `<p class="kucuk" style="margin:6px 0 0">Yıllık ortalama: ${tl(yk)} km</p>`;
}
function alan(a, ad, etiket, ipucu, mod) {
  const id = "a" + a.id + ad;
  return `<label for="${id}">${etiket}</label>
    <input id="${id}" type="text" inputmode="${mod || "numeric"}" data-arac="${a.id}" data-alan="${ad}" value="${esc(a[ad] ?? "")}" ${ipucu ? `placeholder="${ipucu}"` : ""}>`;
}
function ekranVeri() {
  if (D.aktifArac >= D.araclar.length) D.aktifArac = 0;
  const a = D.araclar[D.aktifArac];
  const k = D.kriterler;
  const sekmeler = D.araclar.map((x, i) => `<button type="button" class="sekme ${i === D.aktifArac ? "aktif" : ""}" data-is="aktif" data-i="${i}">${esc(kisaAd(x))}</button>`).join("");
  let kullanici = "";
  if (k.includes("fiyat")) {
    kullanici += alan(a, "fiyat", "Fiyat (TL)", "Örn. 1.250.000");
    if (a.kasko) kullanici += `<p class="kucuk" style="margin:6px 0 0">TSB kasko değeri: <strong>${tl(a.kasko)} TL</strong> <button type="button" class="link-btn" style="min-height:36px;font-size:13px" data-is="kaskoYaz">Fiyat olarak yaz</button></p>`;
  }
  kullanici += alan(a, "km", "Kilometre" + (k.includes("km") ? "" : " (isteğe bağlı)"), "Örn. 85.000");
  kullanici += `<div id="ykNot">${ykNotu(a)}</div>`;
  if (k.includes("hasar")) kullanici += alan(a, "hasar", "Hasar kaydı (TL, yoksa 0)", "0");
  if (k.includes("degisen")) kullanici += alan(a, "degisen", "Değişen parça sayısı", "0");
  if (k.includes("boyali")) kullanici += alan(a, "boyali", "Boyalı parça sayısı", "0");

  let otomatik = "";
  if (k.includes("yakit")) {
    otomatik += alan(a, "tuketim", `Ortalama tüketim (${a.yakit === "Elektrik" ? "kWh" : "L"}/100 km, ${esc(a.yakit)})`, a.yakit === "Elektrik" ? "Örn. 16" : "Örn. 5,5", "decimal");
    if (a.tuketim === "" || a.tuketim === null) otomatik += `<p class="kucuk" style="margin:6px 0 0">Bu bilgi katalogda yok. İlandan, üreticinin teknik broşüründen veya satıcıdan öğrenebilirsin.</p>`;
  }
  if (k.includes("hp")) otomatik += alan(a, "hp", "Motor gücü (HP)" + (a.hp ? "" : " — katalogda yok, ilandan bak"));
  if (k.includes("konfor")) otomatik += alan(a, "konfor", `Konfor puanı (1-5, ${esc(a.kasa)})`);
  if (k.includes("paket")) otomatik += alan(a, "seviye", `Paket seviyesi (1-5${a.paket ? ", " + esc(a.paket) : ", kasko değerine göre tahmini"})`);
  if (k.includes("satis")) otomatik += alan(a, "satis", "Satış piyasası (1-5, değer korumasına göre tahmini)");
  if (k.includes("yas")) otomatik += `<p class="kucuk" style="margin-top:12px">Yaş: ${aracYasi(a)} (model yılından hesaplandı)</p>`;

  let yakitKart = "";
  if (k.includes("yakit")) {
    yakitKart = `<section class="kart bosluk">
      <h2>Yakıt fiyatları</h2>
      <p class="kucuk" style="margin:4px 0 0">TL/litre, elektrik TL/kWh. Varsayılan: 2 Kasım 2026, İstanbul. Kendi şehrindeki güncel fiyatı yaz.</p>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px">
        ${[["benzin", "Benzin"], ["dizel", "Dizel"], ["lpg", "LPG"], ["elektrik", "Elektrik"]].map(([id, t]) => `<div><label for="y${id}">${t}</label><input id="y${id}" type="text" inputmode="decimal" data-yakit="${id}" value="${esc(String(D.yakit[id]).replace(".", ","))}"></div>`).join("")}
      </div>
    </section>`;
  }
  return ust(6) + `<main>
    <h1>Araç bilgilerini gir</h1>
    <p class="alt">Sadece seçtiğin kriterler için gereken bilgileri soruyoruz.</p>

      <h2>${esc(aracAdi(a))}, ${esc(a.yil)}</h2>

    ${otomatik ? `<section class="kart bosluk"><h2>Otomatik gelen değerler</h2><p class="kucuk" style="margin:4px 0 0">Yanlışsa değiştirebilirsin.</p>${otomatik}</section>` : ""}
    ${yakitKart}
    ${D.hata ? `<p class="hata" role="alert">${esc(D.hata)}</p>` : ""}
    <div class="alt-bolum">
      <button type="button" class="ana-btn" data-is="hesapla">Sonucu hesapla</button>
    </div>
  </main>`;
}

/* Hassasiyet: bir kriterin önemi azalır/artarsa birinci değişiyor mu? */
function hassasiyet(grup, w) {
  if (grup.length < 2) return [];
  const birinci = topsis(grup, D.kriterler, w)[0].arac.id;
  const mesajlar = [];
  D.kriterler.forEach((k, i) => {
    [0.5, 2].forEach(f => {
      const yeni = w.map((x, j) => j === i ? x * f : x);
      const t = yeni.reduce((s, x) => s + x, 0);
      const sonuc = topsis(grup, D.kriterler, yeni.map(x => x / t))[0].arac;
      if (sonuc.id !== birinci) mesajlar.push(`<strong>${KRITER[k].ad}</strong> kriterinin önemi ${f > 1 ? "artarsa" : "azalırsa"} birinci <strong>${esc(kisaAd(sonuc))}</strong> olur.`);
    });
  });
  return mesajlar;
}
function gerekce(kazanan, grup, w) {
  if (grup.length < 2) return "";
  const guclu = [];
  D.kriterler.forEach((k, i) => {
    const degerler = grup.map(a => deger(a, k));
    const en = KRITER[k].yon === "max" ? Math.max(...degerler) : Math.min(...degerler);
    if (deger(kazanan, k) === en && new Set(degerler).size > 1) guclu.push({ ad: KRITER[k].ad, w: w[i] });
  });
  guclu.sort((x, y) => y.w - x.w);
  if (!guclu.length) return "";
  return `${esc(kisaAd(kazanan))} en çok şu kriterlerde öne çıkıyor: ${guclu.slice(0, 3).map(x => x.ad).join(", ")}.`;
}
function siraListesi(sonuc, sari, rozetli) {
  return sonuc.map((s, i) => {
    const d = guvenlik(s.arac);
    return `<div>
      <div class="cubuk-satir"><span style="font-weight:600">${i + 1}. ${esc(aracAdi(s.arac))}${rozetli ? `<span class="rozet ${d}">${DURUM_AD[d]}</span>` : ""}</span><span style="font-weight:700">${puanYaz(s.puan)}</span></div>
      <div class="cubuk ${sari ? "sari" : ""}" aria-hidden="true"><div style="width:${Math.max(2, s.puan * 100)}%"></div></div>
    </div>`;
  }).join("");
}
function ekranSonuc() {
  const w = agirliklar();
  const tum = topsis(D.araclar, D.kriterler, w);
  const guvenli = D.araclar.filter(a => guvenlik(a) === "gecti");
  const guvenliSonuc = guvenli.length >= 2 ? topsis(guvenli, D.kriterler, w) : null;
  const enIyi = tum[0];
  const enIyiDurum = guvenlik(enIyi.arac);

  let baslik, kartlar, aciklama;
  if (enIyiDurum === "gecti") {
    const p = guvenliSonuc ? guvenliSonuc[0].puan : enIyi.puan;
    baslik = "Net öneri";
    kartlar = `<section class="sonuc-kart koyu"><h2>En yüksek puan ve güvenlik kontrolünden geçti</h2><div class="ad">${esc(aracAdi(enIyi.arac))}</div><div class="puan">${puanYaz(p)}</div></section>`;
    aciklama = `${esc(kisaAd(enIyi.arac))} hem puanda önde hem de güvenlik kontrolünden geçti.`;
  } else {
    const sorun = enIyiDurum === "kaldi" ? "Güvenlik kontrolünden geçmedi" : "Güvenlik bilgisi doğrulanmadı";
    const solKart = `<section class="sonuc-kart ${enIyiDurum === "kaldi" ? "kirmizi-ust" : ""}"><h2>En yüksek puan</h2><div class="ad">${esc(kisaAd(enIyi.arac))}</div><div class="puan">${puanYaz(enIyi.puan)}</div>
      <div class="rozet ${enIyiDurum}" style="display:flex;gap:5px;margin:8px 0 0">${UYARI_IKON}<span>${sorun}</span></div></section>`;
    if (guvenli.length === 0) {
      baslik = "Güvenlik kontrolünü geçen araç yok";
      kartlar = `<section class="sonuc-kart kirmizi-ust"><h2>En yüksek puan (bilgi amaçlı)</h2><div class="ad">${esc(aracAdi(enIyi.arac))}</div><div class="puan">${puanYaz(enIyi.puan)}</div></section>`;
      aciklama = "Adaylarının hiçbiri güvenlik kontrolünden geçmedi veya bilgileri doğrulanmadı. Sıralama sadece bilgi amaçlıdır; ekspertiz sonuçlarını girdikten sonra tekrar dene.";
    } else if (guvenli.length === 1) {
      baslik = "İki sonuç birbirinden farklı";
      kartlar = `<div class="sonuc-ikili">${solKart}<section class="sonuc-kart koyu"><h2>Güvenlikten geçen tek aday</h2><div class="ad">${esc(kisaAd(guvenli[0]))}</div><div class="rozet" style="display:flex;gap:5px;margin:8px 0 0;color:var(--sari)">${TIK_IKON}<span>Güvenlikten geçti</span></div></section></div>`;
      aciklama = `${esc(kisaAd(enIyi.arac))} puanda önde, ama güvenlik açısından sorunlu. Güvenlik kontrolünü geçen tek araç ${esc(kisaAd(guvenli[0]))}.`;
    } else {
      const g = guvenliSonuc[0];
      baslik = "İki sonuç birbirinden farklı";
      kartlar = `<div class="sonuc-ikili">${solKart}<section class="sonuc-kart koyu"><h2>Güvenlikten geçenlerde en yüksek</h2><div class="ad">${esc(kisaAd(g.arac))}</div><div class="puan">${puanYaz(g.puan)}</div><div class="rozet" style="display:flex;gap:5px;margin:8px 0 0;color:var(--sari)">${TIK_IKON}<span>Güvenlikten geçti</span></div></section></div>`;
      aciklama = `${esc(kisaAd(enIyi.arac))} puanda önde, ama ${enIyiDurum === "kaldi" ? "güvenlik kontrolünden geçmedi" : "güvenlik bilgileri doğrulanmadı"}. Önceliğin güvenlikse ${esc(kisaAd(g.arac))} daha uygun.`;
    }
  }

  const grup = guvenliSonuc ? guvenli : D.araclar;
  const kazanan = guvenliSonuc ? guvenliSonuc[0].arac : enIyi.arac;
  const gerekceYazi = gerekce(kazanan, grup, w);
  const hassas = hassasiyet(grup, w);

  const uyarilar = [];
  D.araclar.forEach(a => {
    const d = guvenlik(a);
    if (d === "kaldi") uyarilar.push(`<strong>${esc(kisaAd(a))}:</strong> Güvenlik kontrolünden geçmedi.`);
    if (d === "dogrulanmadi") uyarilar.push(`<strong>${esc(kisaAd(a))}:</strong> Güvenlik bilgileri doğrulanmadı.`);
    const yk = yillikKm(a);
    if (yk !== null && yk < 5000) uyarilar.push(`<strong>${esc(kisaAd(a))}:</strong> Yıllık ortalama ${tl(yk)} km, kilometreyi doğrula.`);
    if (yk !== null && yk > 35000) uyarilar.push(`<strong>${esc(kisaAd(a))}:</strong> Yıllık ortalama ${tl(yk)} km, yoğun kullanılmış olabilir.`);
  });

  return ust(7) + `<main>
    <h1>${baslik}</h1>
    <div class="bosluk">${kartlar}</div>
    <p style="margin:14px 0 0;font-size:16px">${aciklama}</p>
    ${gerekceYazi ? `<p style="margin:8px 0 0;font-size:16px">${gerekceYazi}</p>` : ""}

    <section class="kart bosluk">
      <h2>Tüm araçların sıralaması</h2>
      <div class="yigin" style="margin-top:10px;gap:10px">${siraListesi(tum, false, true)}</div>
      ${guvenliSonuc && guvenli.length < D.araclar.length ? `<h2 style="margin-top:18px">Sadece güvenlikten geçenler</h2><div class="yigin" style="margin-top:10px;gap:10px">${siraListesi(guvenliSonuc, true, false)}</div>` : ""}
      <p class="kucuk" style="margin:10px 0 0">Puanlar 0 ile 1 arasındadır (TOPSIS). Karşılaştırılan araçlar değişince puanlar da değişir.</p>
    </section>

    <section class="kart bosluk">
      <h2>Sonucu ne değiştirir?</h2>
      ${hassas.length ? `<ul class="duz">${hassas.map(m => `<li>${m}</li>`).join("")}</ul>`
                      : `<p style="margin:6px 0 0">Bir kriterin önemi yarıya inse veya iki katına çıksa da birinci değişmiyor. Sonuç sağlam görünüyor.</p>`}
      <button type="button" class="link-btn yazdir-gizle" data-is="git" data-adim="5">Öncelikleri değiştir ve tekrar dene</button>
    </section>

    ${uyarilar.length ? `<div class="uyari bosluk" style="display:block"><strong>Dikkat edilecekler</strong><ul class="duz">${uyarilar.map(u => `<li>${u}</li>`).join("")}</ul></div>` : ""}

    <div class="alt-bolum">
      <button type="button" class="ana-btn yazdir-gizle" data-is="yazdir">Raporu kaydet / yazdır</button>
      <p class="kucuk" style="margin:10px 0 0">Bu sonuç karar desteği içindir, satın alma tavsiyesi değildir. Girilen bilgilerin ve tahmini değerlerin doğruluğundan site sorumlu değildir. Satın almadan önce ekspertiz ve tramer kontrolü yaptır.</p>
    </div>
  </main>`;
}

/* =========================================================
   7) ÇİZİM VE OLAYLAR
   ========================================================= */
const EKRANLAR = [ekranKarsilama, ekranSecim, ekranAdaylar, ekranGuvenlik, ekranKriterler, ekranSiralama, ekranVeri, ekranSonuc];
const kok = document.getElementById("uygulama");
function ciz(yukari) {
  kok.innerHTML = EKRANLAR[D.adim]();
  kaydet();
  if (yukari) window.scrollTo(0, 0);
}
function git(adim) {
  // Ön koşulları kontrol et
  if (adim >= 3 && D.araclar.length < 2) adim = D.araclar.length ? 2 : 1;
  if (adim >= 4 && !D.araclar.every(a => a.agir && a.tasiyici)) adim = 3;
  if (adim >= 5 && D.kriterler.length < 2) adim = 4;
  if (adim >= 5) siralamaEsle();
  if (adim === 3 || adim === 6) D.aktifArac = 0;
  D.adim = adim; D.hata = "";
  ciz(true);
}
function aracEkle() {
  const s = D.secim;
  let a;
  if (s.elle) {
    const yil = sayi(s.elleYil), hp = sayi(s.elleHp), tuk = sayi(s.elleTuketim);
    if (!s.elleAd.trim() || isNaN(yil) || yil < 1980 || yil > BU_YIL + 1) {
      D.hata = "Marka/model ve model yılı bilgilerini doldur."; return ciz();
    }
    const sev = Number(s.elleSeviye);
    a = { marka: "", model: s.elleAd.trim(), yil, motor: "Elle girildi", yakit: s.elleYakit, hp: isNaN(hp) ? "" : hp, tuketim: isNaN(tuk) ? "" : tuk, vites: "", kasko: 0,
          kasa: s.elleKasa, paket: sev === 1 ? "Giriş paketi" : sev === 5 ? "En üst paket" : "Orta paket", seviye: sev, satis: 3, konfor: KONFOR[s.elleKasa] };
  } else {
    if (!KATALOG_VAR || !s.marka || !s.model || !s.yil || s.versiyon === "") {
      D.hata = "Marka, model, yıl ve versiyonu seç."; return ciz();
    }
    const m = KATALOG[s.marka][s.model], v = m.v[Number(s.versiyon)], kasa = KASA_AD[v[4]];
    a = { marka: s.marka, model: s.model, yil: Number(s.yil), motor: v[0], yakit: YAKIT_AD[v[2]], hp: v[1] || "", tuketim: "",
          vites: VITES_AD[v[3]], kasa, paket: "", seviye: v[5], satis: m.s, konfor: KONFOR[kasa],
          kasko: versiyonDegeri(v, Number(s.yil)) * 1000 };
  }
  Object.assign(a, { id: ++siradakiId, fiyat: "", km: "", hasar: "", degisen: "", boyali: "", agir: null, tasiyici: null });
  D.araclar.push(a);
  D.secim = { ...bosDurum().secim, elle: false };
  D.adim = 2; D.hata = "";
  ciz(true);
}
function hesapla() {
  const eksik = [];
  const gerekli = [];
  if (D.kriterler.includes("fiyat")) gerekli.push(["fiyat", "fiyat"]);
  if (D.kriterler.includes("km")) gerekli.push(["km", "kilometre"]);
  if (D.kriterler.includes("hasar")) gerekli.push(["hasar", "hasar kaydı"]);
  if (D.kriterler.includes("degisen")) gerekli.push(["degisen", "değişen parça"]);
  if (D.kriterler.includes("boyali")) gerekli.push(["boyali", "boyalı parça"]);
  if (D.kriterler.includes("yakit")) gerekli.push(["tuketim", "tüketim"]);
  if (D.kriterler.includes("hp")) gerekli.push(["hp", "motor gücü"]);
  if (D.kriterler.includes("konfor")) gerekli.push(["konfor", "konfor puanı"]);
  if (D.kriterler.includes("paket")) gerekli.push(["seviye", "paket seviyesi"]);
  if (D.kriterler.includes("satis")) gerekli.push(["satis", "satış piyasası"]);
  D.araclar.forEach((a, i) => {
    gerekli.forEach(([alan, ad]) => {
      const v = sayi(a[alan]);
      if (isNaN(v) || v < 0) eksik.push({ i, yazi: `${kisaAd(a)}: ${ad}` });
    });
  });
  if (D.kriterler.includes("yakit")) {
    const kullanilan = new Set(D.araclar.map(a => a.yakit));
    if ((kullanilan.has("Benzin") || kullanilan.has("Hibrit")) && !(sayi(D.yakit.benzin) > 0)) eksik.push({ i: D.aktifArac, yazi: "benzin fiyatı" });
    if (kullanilan.has("Dizel") && !(sayi(D.yakit.dizel) > 0)) eksik.push({ i: D.aktifArac, yazi: "dizel fiyatı" });
    if (kullanilan.has("LPG") && !(sayi(D.yakit.lpg) > 0)) eksik.push({ i: D.aktifArac, yazi: "LPG fiyatı" });
    if (kullanilan.has("Elektrik") && !(sayi(D.yakit.elektrik) > 0)) eksik.push({ i: D.aktifArac, yazi: "elektrik fiyatı (TL/kWh)" });
  }
  if (eksik.length) {
    D.aktifArac = eksik[0].i;
    D.hata = "Eksik veya hatalı bilgi: " + eksik.slice(0, 4).map(e => e.yazi).join(", ") + (eksik.length > 4 ? "…" : "");
    return ciz(true);
  }
  D.adim = 7; D.hata = "";
  ciz(true);
}

kok.addEventListener("click", e => {
  const b = e.target.closest("[data-is]");
  if (!b || b.disabled) return;
  const is = b.dataset.is;
  const s = D.secim;
  switch (is) {
    case "git": return git(Number(b.dataset.adim));
    case "sifirla":
      if (D.adim > 0) { D = bosDurum(); ciz(true); }
      return;
    case "elleDegistir": s.elle = !s.elle; D.hata = ""; return ciz();
    case "kaskoYaz": {
      const a = D.araclar[D.aktifArac];
      a.fiyat = Math.round(a.kasko).toLocaleString("tr-TR");
      return ciz();
    }
    case "aracEkle": return aracEkle();
    case "aracSil": D.araclar = D.araclar.filter(a => String(a.id) !== b.dataset.id); return ciz();
    case "aktif": D.aktifArac = Number(b.dataset.i); D.hata = ""; return ciz(true);
    case "guvenlik": {
      const a = D.araclar[D.aktifArac];
      a[b.dataset.alan] = b.dataset.v;
      return ciz();
    }
    case "kriter": {
      const id = b.dataset.id;
      if (D.kriterler.includes(id)) D.kriterler = D.kriterler.filter(x => x !== id);
      else if (D.kriterler.length < MAKS_KRITER) D.kriterler.push(id);
      return ciz();
    }
    case "kriterBitti": return git(5);
    case "yukari":
    case "asagi": {
      const r = Number(b.dataset.r);
      const h = is === "yukari" ? r - 1 : r + 1;
      if (h < 0 || h >= D.siralama.length) return;
      [D.siralama[r], D.siralama[h]] = [D.siralama[h], D.siralama[r]];
      ciz();
      // Odağı taşınan kriterin aynı yöndeki düğmesinde tut
      const yeni = kok.querySelector(`[data-is="${is}"][data-r="${h}"]`) || kok.querySelector(`[data-r="${h}"]`);
      if (yeni) yeni.focus();
      return;
    }
    case "hesapla": return hesapla();
    case "yazdir": return window.print();
  }
});

kok.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.secim) {
    const s = D.secim;
    const alanAd = el.dataset.secim;
    s[alanAd] = el.value;
    if (alanAd === "marka") { s.model = ""; s.yil = ""; s.versiyon = ""; }
    if (alanAd === "model") { s.yil = ""; s.versiyon = ""; }
    if (alanAd === "yil") { s.versiyon = ""; }
    D.hata = "";
    ciz();
  } else if (el.dataset.alan && el.dataset.alan.startsWith("secim.")) {
    D.secim[el.dataset.alan.slice(6)] = el.value; kaydet();
  }
});

kok.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.arac) {
    const a = D.araclar.find(x => String(x.id) === el.dataset.arac);
    if (!a) return;
    a[el.dataset.alan] = el.value;
    if (el.dataset.alan === "km") {
      // Yıllık km notunu odak kaybolmadan güncelle
      const yer = document.getElementById("ykNot");
      if (yer) yer.innerHTML = ykNotu(a);
    }
    kaydet();
  } else if (el.dataset.yakit) {
    D.yakit[el.dataset.yakit] = el.value; kaydet();
  } else if (el.dataset.alan && el.dataset.alan.startsWith("secim.")) {
    D.secim[el.dataset.alan.slice(6)] = el.value; kaydet();
  }
});

/* Eski kayıtta adım geçersizse düzelt */
if (!(D.adim >= 0 && D.adim < EKRANLAR.length)) D.adim = 0;
ciz();
</script>
